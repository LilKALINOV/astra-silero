[plugin]
id = "silero-tts"
name = "Silero TTS"
version = "0.1.0"
description = "Local Russian text-to-speech on Silero V5. Voices: aidar, baya, kseniya, xenia, eugene. Runs offline after a one-time model download."
author = "Lil KALINOV"
license = "MIT"

[entry]
command = "target/release/silero_tts.exe"
cwd = "."
runtimes = ["python"]

# `[capabilities]` is what Astra may call INTO this plugin.
[capabilities]
tts = true

# `[permissions]` is what this plugin may call OUT to Astra. This plugin needs
# no host calls beyond the bootstrap set, so the section stays empty.
[permissions]

[platform]
os = ["windows", "linux"]
arch = ["x86_64"]

# Plugin settings (Settings page). The Rust side receives them via `on_config`.
# Voice picker lives on Astra's Voice page — it comes from `tts_voices`.
[config]
schema = """
{
  "type": "object",
  "properties": {
    "default_voice": {
      "type": "string",
      "title": "$config.default_voice.title",
      "description": "$config.default_voice.description",
      "enum": ["aidar", "baya", "kseniya", "xenia", "eugene"],
      "enumNames": [
        "$config.default_voice.aidar",
        "$config.default_voice.baya",
        "$config.default_voice.kseniya",
        "$config.default_voice.xenia",
        "$config.default_voice.eugene"
      ],
      "default": "xenia"
    },
    "model": {
      "type": "string",
      "title": "$config.model.title",
      "description": "$config.model.description",
      "enum": ["v5_5_ru", "v4_ru"],
      "enumNames": ["$config.model.v5_5_ru", "$config.model.v4_ru"],
      "default": "v5_5_ru"
    },
    "sample_rate": {
      "type": "integer",
      "title": "$config.sample_rate.title",
      "description": "$config.sample_rate.description",
      "enum": [8000, 24000, 48000],
      "enumNames": [
        "$config.sample_rate.8000",
        "$config.sample_rate.24000",
        "$config.sample_rate.48000"
      ],
      "default": 24000
    }
  }
}
"""